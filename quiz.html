<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#28674e">
  <title>퀴즈 풀기 - 늘봄 건강 퀴즈</title>
  <link rel="stylesheet" href="css/quiz-mobile.css?v=20261110-mobile1">
</head>
<body class="quiz-page">
  <div class="quiz-shell">
    <header class="quiz-topbar">
      <div class="quiz-heading">
        <button type="button" class="quiz-back" onclick="goHome()" aria-label="홈으로 돌아가기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" /></svg>
        </button>
        <h1>건강 퀴즈</h1>
      </div>
      <div class="quiz-balance" aria-label="보유 포인트">
        <span id="points">0</span><span class="quiz-point-unit">P</span>
      </div>
    </header>

    <main class="quiz-main">
      <section id="quiz-box" aria-labelledby="question">
        <div id="loading" class="loading" role="status" style="display:none;">
          <span class="loading-spinner" aria-hidden="true"></span>문제를 불러오고 있어요
        </div>
        <div class="question-card">
          <div class="question-eyebrow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 4.5C10 2 4 6 4 12c0 4 3 7 7 7 6 0 10-6 8.5-14.5Z"/><path d="M4 21 15 10M9 16v-5M9 16h5"/></svg>
            <span>건강 상식</span>
          </div>
          <h2 id="question" tabindex="-1">문제를 불러오고 있어요</h2>
        </div>

        <ul id="answers" aria-label="답 선택"></ul>
        <p id="answer-hint" class="answer-hint">답을 골라보세요</p>

        <section id="explanation-popup" class="quiz-feedback" aria-live="polite" aria-atomic="true" hidden>
          <div class="feedback-heading">
            <span id="popup-emoji" class="feedback-icon" aria-hidden="true"></span>
            <h3 id="popup-result"></h3>
            <span id="popup-points" class="feedback-points"></span>
          </div>
          <p id="popup-answer" class="feedback-answer" hidden></p>
          <p id="popup-explanation" class="feedback-explanation"></p>
        </section>

        <div id="quiz-actions" class="quiz-actions" hidden>
          <button id="next-question" type="button" class="primary-button" onclick="nextQuestion()" disabled>
            다음 문제
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </div>

        <div hidden aria-hidden="true">
          <span id="progress-text"></span><span id="progress-fill"></span>
          <div id="timer-bar"><div id="timer-fill"></div></div>
          <div id="explanation"></div>
        </div>
      </section>

      <section id="quiz-complete" class="quiz-complete" style="display:none;" aria-labelledby="complete-title">
        <span class="complete-check" aria-hidden="true">✓</span>
        <h2 id="complete-title">오늘도 건강한 선택을 쌓았어요</h2>
        <div class="quiz-stats">
          <div class="stat-card"><h3>보유 포인트</h3><p><span id="final-points">0</span>P</p></div>
          <div class="stat-card"><h3>정답률</h3><p><span id="accuracy">0</span>%</p></div>
          <div class="stat-card"><h3>소요 시간</h3><p><span id="time-taken">0</span>초</p></div>
        </div>
        <div id="exchange-box" style="display:none;"></div>
        <button id="continue-quiz" type="button" onclick="continueQuiz()" class="primary-button">계속해서 풀기</button>
        <button type="button" onclick="goHome()" class="secondary-button">홈으로 돌아가기</button>
      </section>
    </main>
  </div>

  <script src="script.js?v=20261117-share500-install1"></script>
  <script type="module" async src="js/quiz-points.js?v=20261106-points1"></script>
</body>
</html>
